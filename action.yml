# 資料 repo 的 CI 用：uses: tsunderink/seasoningway@<版本>，版本和 seasoningway.toml 的 engine 一致（upgrade 會一起改）。
# 骨架階段 check 還沒實作，第 3 階段完成後才能用（docs/migration.md）。
name: seasoningway check
description: 用指定版本的 seasoningway 檢查旅程資料 repo
inputs:
  python-version:
    description: Python 版本
    default: "3.13"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: seasoningway check
