name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.x"]  # 最低支援版本和最新的穩定版
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: npm install -g playwright@1 leaflet@1.9.4 && echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: python3 -m unittest discover -s tests
        env:
          SEASONINGWAY_BROWSER_TEST: require
      - run: seasoningway --root tests/fixtures/demo check
