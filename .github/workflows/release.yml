name: release
# main 的 CI 通過後，__version__ 對應的標籤還沒發布就建立標籤和 Release。發新版只要在 PR 裡改 __version__。
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
concurrency: release
jobs:
  release:
    if: >-
      github.repository == 'tsunderink/seasoningway' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: 發布通過 main CI 的版本
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -nE 's/^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' src/seasoningway/__init__.py)
          test -n "$version"
          tag="v$version"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = true ]; then
              echo "$tag 已有 Release 草稿，請核對草稿指向的 commit" >&2
              exit 1
            fi
            echo "$tag 已發布"
            exit 0
          fi
          sha=$(git rev-parse HEAD)
          if existing=$(git ls-remote --exit-code --tags origin "refs/tags/$tag"); then
            test "$(cut -f1 <<< "$existing")" = "$sha"
          else
            test "$?" -eq 2
          fi
          gh release create "$tag" --target "$sha" --title "$tag" \
            --generate-notes
